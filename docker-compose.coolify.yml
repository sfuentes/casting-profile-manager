# Coolify Production Deployment
#
# HOW TO USE IN COOLIFY:
#   1. Create a new "Docker Compose" resource in Coolify
#   2. Point it at this repository and select this file as the compose file
#   3. Set the required environment variables in the Coolify UI (see .env.coolify.example)
#   4. Coolify will handle SSL termination via its built-in Traefik proxy
#
# PORTS / ROUTING:
#   - Frontend (Nginx):  published via SERVICE_FQDN_FRONTEND_80 (your app domain)
#   - Backend API:       published via SERVICE_FQDN_BACKEND_5000 (your API subdomain)
#   - MongoDB:           internal only (not exposed publicly)
#
#   Those SERVICE_FQDN_* entries are Coolify magic variables declared on the
#   services below. They are what makes Coolify allocate a domain and emit the
#   Traefik routing labels - `expose:` alone only opens the port on the internal
#   network. Coolify populates them on deploy; set your own domains under
#   Coolify -> Environment Variables to override.
#
# IMPORTANT: VITE_API_URL must be your public API URL (e.g. https://api.yourdomain.com/api)
#            because it is compiled into the frontend bundle at build time.
#
# REQUIRED ENV VARS (must be set in Coolify):
#   - MONGO_ROOT_PASSWORD (no default - will fail without it)
#   - JWT_SECRET (no default - will fail without it; openssl rand -hex 64)
#   - CREDENTIAL_ENCRYPTION_KEY (no default; openssl rand -hex 32)
#   - VITE_API_URL (no default - frontend will break without it)
#   - FRONTEND_URL (no default - CORS will break without it)

services:
  # ─── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    # Only pull if the image is not already cached on the host.
    # This avoids Docker Hub anonymous rate-limit errors (100 pulls/6 h per IP)
    # on Hetzner/Coolify servers.  On a brand-new server, run once on the host:
    #   docker pull mongo:7.0
    # or configure Docker Hub credentials in Coolify → Settings → Registries.
    pull_policy: if_not_present
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      # CRITICAL: MONGO_ROOT_PASSWORD must be set in Coolify env vars
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set in Coolify environment variables}
      MONGO_INITDB_DATABASE: darsteller-manager
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - casting-network
    healthcheck:
      # Test with credentials so the healthcheck only passes once MongoDB is
      # actually accepting authenticated connections (not just responding to ping).
      # This prevents the backend from starting before auth is fully initialised.
      # $$ escapes the $ so Docker Compose does NOT interpolate at parse time;
      # the running container's shell expands them as $MONGO_INITDB_ROOT_* instead.
      test: ["CMD-SHELL", "mongosh --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 2)' --quiet"]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 180s  # Increased from 120s for slower Coolify servers

  # ─── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Coolify magic variable. Declaring it makes Coolify allocate a domain for
      # this service and generate the Traefik labels that actually publish it;
      # the _5000 suffix is the container port to route to. Without this, the
      # service is only `expose`d on the internal network and is unreachable
      # from the internet. Coolify fills in the value on deploy - override it
      # under Coolify -> Environment Variables to use your own domain.
      SERVICE_FQDN_BACKEND_5000: ""
      NODE_ENV: production
      PORT: 5000
      # Pass MongoDB credentials individually so the backend can safely
      # URL-encode them (openssl rand -base64 passwords contain / + = which
      # break a pre-assembled URI string).  The URI is built in database.js.
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD required}
      MONGO_HOST: mongodb
      MONGO_DB: darsteller-manager
      # CRITICAL: JWT_SECRET must be strong - generate with: openssl rand -hex 64
      # Required, with no default on purpose. A default here would be a literal
      # shared string baked into this public repo (Compose does not evaluate
      # $(...)), so every deployment would sign tokens with the same key and
      # anyone could forge a session. Fail the deploy instead.
      #
      # Keep this line unquoted and the message plain, matching the other :?
      # vars below. Coolify's compose parser mis-reads a quoted ${VAR:?msg} and
      # registers the whole expression as a secret name, failing the deploy with
      # "secrets additional properties ... not allowed" before anything starts.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in Coolify environment variables}
      # Encrypts platform credentials at rest. Required and without a default:
      # losing or changing it makes every stored credential undecryptable, so it
      # must be set deliberately and then left alone. Keep it separate from
      # JWT_SECRET so rotating one does not force rotating the other.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY must be set in Coolify environment variables}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_COOKIE_EXPIRE: ${JWT_COOKIE_EXPIRE:-7}
      # CRITICAL: Set this to your public frontend domain for CORS
      # Example: https://app.yourdomain.com (no trailing slash)
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set in Coolify environment variables}
      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-600000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - casting-network
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s  # Increased from 3s for slower servers
      retries: 5   # Increased from 3 for more reliability
      start_period: 60s  # Increased from 40s to allow MongoDB connection time

  # ─── Frontend (React → Nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # CRITICAL: This URL is baked into the JS bundle at build time by Vite.
        # It must be the publicly reachable URL of the backend API.
        # Example: https://api.yourdomain.com/api (must include /api)
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL must be set in Coolify environment variables}
    restart: unless-stopped
    environment:
      # Coolify magic variable - see the note on the backend service above.
      # Routes the allocated domain to this container's port 80 (Nginx).
      SERVICE_FQDN_FRONTEND_80: ""
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - casting-network
    expose:
      - "80"
    healthcheck:
      # 127.0.0.1, not localhost. nginx.conf declares only `listen 80` (IPv4),
      # and the nginx entrypoint skips its listen-on-ipv6 patch because our
      # config differs from the packaged one - so nothing binds [::]:80. busybox
      # wget resolves localhost to ::1 first and gets ECONNREFUSED, marking the
      # container unhealthy even though it serves fine over IPv4. Traefik then
      # drops the unhealthy container from the router's server pool and answers
      # public requests with 503.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local

networks:
  casting-network:
    driver: bridge
